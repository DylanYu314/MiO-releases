name: Mobile

# Runs on every push to a PR and on main. Actions is free inside the monthly
# allowance, so the only thing worth skipping is a change that *cannot* break
# anything: documentation.
#
# This is a denylist on purpose. An allowlist of the directories each job cares
# about looks tidier and is a trap — anything nobody remembered to list, such as
# docker-compose.yml or .pre-commit-config.yaml, would silently run no CI at all.
on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - "backend/**"
      - "frontend/**"
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - "backend/**"
      - "frontend/**"

jobs:
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Format check (prettier)
        run: npm run format:check

      - name: Typecheck (tsc)
        run: npm run typecheck

      - name: Test (jest)
        run: npm run test

      # Not redundant with the steps above: expo-router turns every file under
      # app/ into a route, so a file that lints, typechecks and tests fine can
      # still break the bundle. Only an export catches that.
      - name: Build (expo export)
        run: npm run build
