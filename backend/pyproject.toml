[project]
name = "mio-backend"
version = "0.0.0"
description = "MiO backend — local-first music library manager API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic-settings>=2.6",
    # 2025.05.22 is the floor for the proof-of-origin token plugin framework
    # the `pot` group needs (#161).
    # ⛔ Not a floor for features — a floor for *working at all*. Measured
    # 2026-09-03 on a residential connection, two videos, alternating: 2026.7.4
    # extracts fine and serves byte 0 fine, then answers **403 past ~1 MiB**;
    # 2026.8.19 serves the whole file. See #651 — the older build picks
    # `android_vr`, which googlevideo caps, and the newer picks `visionos`,
    # which it does not.
    #
    # ⚠️ So "does yt-dlp still extract?" is not a test of this. The broken
    # version passes it.
    "yt-dlp>=2026.8.19",
    "mutagen>=1.47",
    "httpx>=0.27",
    "rapidfuzz>=3.9",
    "celery[redis]>=5.4",
]

[dependency-groups]
# Proof-of-origin tokens for YouTube (#161). Installed in the production image
# only: a home connection is not flagged, and an unconfigured plugin would try
# to reach a provider that local development does not run.
pot = [
    "bgutil-ytdlp-pot-provider>=1.3",
    # The JavaScript that solves YouTube's signature and `n` challenges (#177).
    # Useless without a runtime to execute it — the Dockerfile installs deno,
    # and the two are only ever added or removed together.
    "yt-dlp-ejs>=0.8",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "pytest-cov>=5.0",
    # Read by the guard that asserts the production compose file turns the API
    # documentation off (#765). ⚠️ Declared rather than inherited: it already
    # arrives transitively through `uvicorn[standard]`, and a test resting on
    # another package's dependency tree breaks the day that tree changes, with a
    # failure that points nowhere near the cause.
    "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's Depends(...) default-argument DI pattern triggers this; it's
# the documented, idiomatic way to declare dependencies, not a real bug.
ignore = ["B008"]

[tool.ruff.lint.isort]
# `backend/alembic/` is a directory in this repo *and* the name of the installed
# package, so isort has to be told which one an `from alembic import ...` means.
# Left to guess, ruff 0.15 and 0.16 answer differently and CI disagrees with a
# local run — which is exactly what happened once. It is always the package:
# nothing imports from the migrations directory.
known-third-party = ["alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
